name: E2E Tests (Playwright)

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-admin:
    name: Playwright Admin E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Start infrastructure
        run: docker compose up -d postgres keycloak redis

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Bootstrap Keycloak and database
        run: node scripts/e2e/bootstrap.mjs
        env:
          CI: 'true'
          DB_NAME: cleantrack
          DB_USER: postgres
          DB_PASSWORD: postgres
          KEYCLOAK_URL: http://localhost:8080
          E2E_DB_PORT: '5432'
          E2E_REDIS_PORT: '6379'

      - name: Start backend
        working-directory: backend
        run: |
          set -a
          source .env.e2e.generated
          set +a
          npm run start:dev &
          echo $! > ../backend.pid
        shell: bash

      - name: Start frontend
        working-directory: frontend
        run: |
          set -a
          source .env.e2e.generated
          set +a
          npm run dev &
          echo $! > ../frontend.pid
        shell: bash

      - name: Wait for application stack
        run: |
          node scripts/e2e/wait-for-url.mjs http://localhost:3000 180000
          node scripts/e2e/wait-for-url.mjs http://localhost:3001 180000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3001
          E2E_ADMIN_USERNAME: admin_tenant
          E2E_ADMIN_PASSWORD: password123

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Stop application processes
        if: always()
        run: |
          if [ -f backend.pid ]; then kill $(cat backend.pid) || true; fi
          if [ -f frontend.pid ]; then kill $(cat frontend.pid) || true; fi
          docker compose down -v
        shell: bash
