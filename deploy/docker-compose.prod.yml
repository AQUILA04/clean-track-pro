# PROD stack — project name: cleantrack-prod
# Hosts (OptimizeSolux convention):
#   cleantrack.optimizesolux.com       → frontend
#   cleantrack-api.optimizesolux.com   → backend
#   cleantrack-auth.optimizesolux.com  → Keycloak
# Start:  docker compose -f docker-compose.prod.yml --project-name cleantrack-prod --env-file /opt/cleantrack/prod/.env up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-cleantrack}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cleantrack} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - internal

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cleantrack}
      KC_DB_USERNAME: ${DB_USER:-postgres}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-cleantrack-auth.optimizesolux.com}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    # Same theme as docker-compose.dev.yml (baked into custom KEYCLOAK_IMAGE, or mounted here).
    # Mount only cleantrack-pro so Keycloak built-in themes (base/keycloak) stay intact.
    volumes:
      - ${KEYCLOAK_THEMES_PATH:-/opt/cleantrack/repo/keycloak/themes/cleantrack-pro}:/opt/keycloak/themes/cleantrack-pro:ro
    command: start
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.cleantrack-prod-keycloak.rule=Host(`${KEYCLOAK_HOSTNAME:-cleantrack-auth.optimizesolux.com}`)"
      - "traefik.http.routers.cleantrack-prod-keycloak.entrypoints=websecure"
      - "traefik.http.routers.cleantrack-prod-keycloak.tls.certresolver=letsencrypt"
      - "traefik.http.services.cleantrack-prod-keycloak.loadbalancer.server.port=8080"

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-cleantrack}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: ${CORS_ORIGINS:-https://cleantrack.optimizesolux.com}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL:-https://cleantrack-auth.optimizesolux.com}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-cleantrack}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-cleantrack-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Used by keycloak:setup for OIDC redirect URIs (prod frontend origin)
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://cleantrack.optimizesolux.com}
      APP_HOSTNAME: ${APP_HOSTNAME:-cleantrack.optimizesolux.com}
      # Keycloak realm SMTP — setup-keycloak falls back to MAIL_* when KEYCLOAK_SMTP_* unset
      KEYCLOAK_SMTP_HOST: ${KEYCLOAK_SMTP_HOST:-}
      KEYCLOAK_SMTP_PORT: ${KEYCLOAK_SMTP_PORT:-}
      KEYCLOAK_SMTP_USER: ${KEYCLOAK_SMTP_USER:-}
      KEYCLOAK_SMTP_PASSWORD: ${KEYCLOAK_SMTP_PASSWORD:-}
      KEYCLOAK_SMTP_FROM: ${KEYCLOAK_SMTP_FROM:-noreply@optimizesolux.com}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${KEYCLOAK_SMTP_FROM_DISPLAY_NAME:-CleanTrackPro}
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USER: ${MAIL_USER:-resend}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM:-CleanTrackPro <noreply@optimizesolux.com>}
    networks:
      - internal
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.cleantrack-prod-backend.rule=Host(`${API_HOSTNAME:-cleantrack-api.optimizesolux.com}`)"
      - "traefik.http.routers.cleantrack-prod-backend.entrypoints=websecure"
      - "traefik.http.routers.cleantrack-prod-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.cleantrack-prod-backend.loadbalancer.server.port=3000"

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://cleantrack-api.optimizesolux.com}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://cleantrack.optimizesolux.com}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-cleantrack-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-https://cleantrack-auth.optimizesolux.com/realms/cleantrack}
    networks:
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.cleantrack-prod-frontend.rule=Host(`${APP_HOSTNAME:-cleantrack.optimizesolux.com}`)"
      - "traefik.http.routers.cleantrack-prod-frontend.entrypoints=websecure"
      - "traefik.http.routers.cleantrack-prod-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.cleantrack-prod-frontend.loadbalancer.server.port=3001"

volumes:
  postgres_data:

networks:
  # Created once by setup-server.sh — avoids compose/setup ownership conflicts
  internal:
    name: cleantrack-prod-internal
    external: true
  traefik-public:
    external: true
