# Local E2E override — avoids conflicts with other dev stacks on the host.
# Usage: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d
services:
  postgres:
    ports: !override
      - "5433:5432"

  redis:
    ports: !override
      - "6380:6379"

  keycloak:
    ports: !override
      - "9081:8080"
    environment:
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 9081
